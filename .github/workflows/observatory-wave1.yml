name: Observatory — Wave 1 experiments (manual, read-only)

# MANUAL ONLY. Runs B1 (does displacement predict continuation?), B2 (does it scale with size?)
# and B6 (what happens after a displacement?) on observatory_data/raw/.
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot.
# The 30% holdout stays SEALED (this workflow has no way to open it).
# Results appear (1) on the run's Summary page and (2) as a downloadable artifact.
on:
  workflow_dispatch:

concurrency:
  group: observatory-wave1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wave1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py observatory/wave1.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required files present."

      - name: Run Wave 1
        run: |
          mkdir -p observatory_run
          python -m observatory.wave1 --raw-dir observatory_data/raw --out observatory_run > observatory_run/console.txt
          cat observatory_run/wave1_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-wave1-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
