# Save as .github/workflows/btc_bot.yml   (the bot itself lives in the btc_bot/ folder of the repo)
# Trigger it from cron-job.org (workflow_dispatch) at :01 and :31 past each hour, so the 30-minute candle has just
# closed. GitHub's own cron is not used (unreliable). cron-job.org sends no inputs, so it always does a normal run.
# You can also start it by hand from the Actions tab and pick a mode:
#   run      normal run (default)
#   ping     test the Twelve Data key and the Telegram link; sends one test message (run this first)
#   status   send the current state of both sides and the demo accounts
#   report   send the technical and fundamental reports now
#   stats    send profit factor / R / drawdown from the live record
#   history  download `days` of candles, replay them through the bot and all accounts, send the results
name: BTC bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        required: false
        default: "run"
        type: choice
        options: [run, ping, status, report, stats, history]
      days:
        description: "History mode only: how many days of candles"
        required: false
        default: "365"

concurrency:
  group: btc-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          MODE: ${{ github.event.inputs.mode }}
          DAYS: ${{ github.event.inputs.days }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${MODE:-run}" in
            ping)    python btc_bot/turtle_btc.py --ping ;;
            status)  python btc_bot/turtle_btc.py --status ;;
            report)  python btc_bot/turtle_btc.py --report ;;
            stats)   python btc_bot/turtle_btc.py --stats --send ;;
            history)
              python btc_bot/turtle_btc.py --download-history "${DAYS:-365}"
              python btc_bot/turtle_btc.py --backtest --send ;;
            *)       python btc_bot/turtle_btc.py ;;
          esac

      # Every file this job writes must be added explicitly or it is wiped on the next run.
      # (journal.jsonl is NOT here: it is written by the command handler, never by this job.)
      - name: Save state, trades, scans, ledger and history
        run: |
          git config user.name "btc-bot"
          git config user.email "btc-bot@users.noreply.github.com"
          for f in state.json trades.jsonl scans.jsonl bank_ledger.jsonl latest.json history_30m.csv; do
            [ -f "btc_bot/data/$f" ] && git add "btc_bot/data/$f"
          done
          [ -d btc_bot/data/backtest ] && git add btc_bot/data/backtest
          if ! git diff --cached --quiet; then
            git commit -m "btc bot data"
            for attempt in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
