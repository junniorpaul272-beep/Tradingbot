name: Observatory — Study L stage 1, Heikin Ashi pattern + 1H support-resistance zones + 15M doji, counts only (manual, read-only)

# MANUAL ONLY. Study L: the reconstructed Heikin Ashi pullback-exhaustion pattern (L.a), with a 1H swing support/resistance location filter (L.b) and a 15M doji at the zone (L.c). STAGE 1 is COUNTS ONLY: setups per reading, usable windows, power tiers, a thin-feed artifact check. NO OUTCOME CODE.
# costs are counted? STAGE 1 is COUNTS ONLY: impulses (Study B population), usable windows, fills / misses / ambiguous bars per policy, FVG availability and depth. NO OUTCOME CODE.
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot. The holdout (2026-06-18 UTC onward) stays SEALED.
on:
  workflow_dispatch:

concurrency:
  group: observatory-studyl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  studyl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/studya.py observatory/studyb.py observatory/studyc.py observatory/studyd.py observatory/studye.py observatory/studyf.py observatory/studyg.py observatory/studyh.py observatory/standards.py observatory/studyi.py observatory/data1m.py observatory/studyl.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required files present."

      - name: Self-test (Heikin Ashi formula, wick and doji rules, trend filter, past-only, spacing, gap contiguity, 1H zones)
        run: python -m observatory.studyl --selftest

      - name: Run the counts-only gate
        run: |
          mkdir -p observatory_run
          python -m observatory.studyl --counts --raw-dir observatory_data/raw --out observatory_run --boundary 2024-10-03 > observatory_run/console.txt
          cat observatory_run/studyl_counts.md >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-studyl-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
