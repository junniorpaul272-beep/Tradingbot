name: Observatory — Wave 2 experiments, FVG (manual, read-only)

# MANUAL ONLY. Runs C1 (does an FVG add information beyond the displacement that created it?),
# C5 (does FVG size matter?) and C7 (immediate entry vs waiting for the retest) on observatory_data/raw/.
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot.
# The holdout (everything from 2026-06-18 UTC onward) stays SEALED: this workflow cannot open it.
# Results appear on the run's Summary page and as a downloadable artifact.
on:
  workflow_dispatch:

concurrency:
  group: observatory-wave2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wave2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/wave2.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required files present."

      - name: Self-test (hand-built paths + random-walk null check)
        run: python -m observatory.wave2 --selftest

      - name: Run Wave 2
        run: |
          mkdir -p observatory_run
          python -m observatory.wave2 --raw-dir observatory_data/raw --out observatory_run > observatory_run/console.txt
          cat observatory_run/wave2_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-wave2-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
