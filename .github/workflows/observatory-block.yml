name: Observatory — run one study on one block of the history (manual, read-only)

# MANUAL ONLY. Runs ONE existing study (A-F) on ONE date window of the data, e.g. the older replication block fetched before 2024-10-03:
#     study  = studya | studyb | studyc | studyd | studye | studyf | studyg
#     window = START/END in UTC dates, start inclusive, end exclusive, END REQUIRED and not later than 2026-06-18  (example: 2020-01-01/2024-10-03)
# The study code is unchanged: observatory/clean.py reads the OBS_WINDOW variable and only REMOVES bars outside the window after cleaning. The sealed holdout (>= 2026-06-18)
# cannot be selected: this workflow refuses a window that ends after it.
# Block runs have no holdout inside them, so the dataset status is EXPLORATORY_READY and verdict labels read EXPLORATORY_SIGNAL, never DISCOVERY_PASS. The numbers (effect, CI, q)
# are what matter; judge a block against the first block by sign, size and interval, and only then pool (the normal study workflow without a window is the pooled run).
# Do NOT change any study definition between blocks. READ-ONLY: no commits, no API calls, no secrets, never touches the live bot.
on:
  workflow_dispatch:
    inputs:
      study:
        description: "Study module to run"
        required: true
        type: choice
        options: [studya, studyb, studyc, studyd, studye, studyf, studyg]
      window:
        description: "UTC window START/END (end exclusive, end <= 2026-06-18), e.g. 2020-01-01/2024-10-03"
        required: true
        type: string

concurrency:
  group: observatory-block-${{ github.event.inputs.study }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OBS_WINDOW: ${{ github.event.inputs.window }}
      STUDY: ${{ github.event.inputs.study }}
    steps:
      - name: Validate the window (the holdout cannot be selected)
        run: |
          case "$OBS_WINDOW" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::window must look like 2020-01-01/2024-10-03"; exit 1;;
          esac
          START="${OBS_WINDOW%%/*}"; END="${OBS_WINDOW##*/}"
          if [[ ! "$START" < "$END" ]]; then echo "::error::start must be before end"; exit 1; fi
          if [[ "$END" > "2026-06-18" ]]; then echo "::error::end must not be after 2026-06-18 (sealed holdout)"; exit 1; fi
          echo "Window OK: $OBS_WINDOW"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py observatory/wave1.py \
                   observatory/studya.py observatory/studyb.py observatory/studyc.py observatory/studyd.py observatory/studye.py observatory/studyf.py observatory/studyg.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          grep -q "OBS_WINDOW" observatory/clean.py || { echo "::error::observatory/clean.py is the old version (no OBS_WINDOW support)"; exit 1; }
          echo "All required files present."

      - name: Structure counts for this block (no outcome is computed)
        run: |
          mkdir -p observatory_run
          if python -m observatory.$STUDY --help | grep -q -- "--counts"; then
            python -m observatory.$STUDY --raw-dir observatory_data/raw --counts | tee observatory_run/${STUDY}_counts.json
          else
            echo "$STUDY has no --counts mode; skipped."
          fi

      - name: Run the study on the block
        run: |
          python -m observatory.$STUDY --raw-dir observatory_data/raw --out observatory_run > observatory_run/console.txt
          { echo "## $STUDY on window $OBS_WINDOW"; echo; cat observatory_run/${STUDY}_report.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-${{ github.event.inputs.study }}-block-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
