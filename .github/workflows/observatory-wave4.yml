name: Observatory — Wave 4 experiments, CRT + outside bar (manual, read-only)

# MANUAL ONLY. Tests the standard-definition CRT claim on 1h candles (sweep one side of the previous 1h candle,
# close back inside, trade toward the far side), measured on 5m and on 15m, plus the outside bar alone.
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot.
# The holdout (everything from 2026-06-18 UTC onward) stays SEALED: this workflow cannot open it.
# Results appear on the run's Summary page and as a downloadable artifact.
on:
  workflow_dispatch:

concurrency:
  group: observatory-wave4
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wave4:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/wave4.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required files present."

      - name: Self-test (hand-built geometry, lookahead, random-walk null)
        run: python -m observatory.wave4 --selftest

      - name: Run Wave 4
        run: |
          mkdir -p observatory_run
          python -m observatory.wave4 --raw-dir observatory_data/raw --out observatory_run > observatory_run/console.txt
          cat observatory_run/wave4_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-wave4-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
