name: Observatory — Study J stage 1, ladder funnel counts only (manual, read-only)

# MANUAL ONLY. Study J (sweep -> CISD / BOS -> POI (OB, rejection block, breaker) -> retest -> BOC, bearish reversal with the bullish mirror pooled): STAGE 1 is COUNTS ONLY. It builds the full
# funnel from mechanical, past-only definitions and counts every node: events, usable 24h windows, weekday, recent/older, blocks, detectable effect, placebo supply and the parent-matched control
# supply. THERE IS NO OUTCOME CODE. READ-ONLY: no commits, no API calls, no secrets, never touches the live bot. The holdout (2026-06-18 UTC onward) stays SEALED.
on:
  workflow_dispatch:

concurrency:
  group: observatory-studyj
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  studyj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/studya.py observatory/studyb.py observatory/studyc.py observatory/studyd.py observatory/studye.py observatory/studyf.py observatory/studyg.py observatory/studyh.py observatory/standards.py observatory/studyi.py observatory/studyj.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required files present."

      - name: Self-test (sweep/reclaim, CISD, BOS, breaker/OB/RB zones, retest, BOC, invalidation, gaps, mirror symmetry, past-only)
        run: python -m observatory.studyj --selftest

      - name: Run the counts-only funnel
        run: |
          mkdir -p observatory_run
          python -m observatory.studyj --counts --raw-dir observatory_data/raw --out observatory_run --boundary 2024-10-03 > observatory_run/console.txt
          cat observatory_run/studyj_counts.md >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-studyj-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
