name: ONE-OFF recover direction state

# One-off. Self-contained (Python stdlib only, imports nothing from the repo).
# Run from a phone browser: Actions -> "ONE-OFF recover direction state" -> Run workflow.
# Run it in this order:  mode=list  ->  mode=dry_run (+sha)  ->  mode=apply (+sha).
# PAUSE the live scanner first. Delete this file when you're done.
# Only the direction/campaign/leg/MIL keys of state.json are transplanted from the
# old commit; cursors and every other key are left alone. Nothing in permanent logs is edited.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list | dry_run | apply | mark_only"
        required: true
        default: "list"
      sha:
        description: "Commit to restore from (dry_run / apply)"
        required: false
        default: ""
      since:
        description: "Start of contaminated window (UTC)"
        required: false
        default: "2026-09-28T08:05:00+00:00"

concurrency:
  group: gbpusd-scanner-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write recovery script
        run: |
          cat > /tmp/recover.py <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timezone

          MODE  = os.environ["MODE"]
          SHA   = os.environ.get("SHA", "").strip()
          SINCE = datetime.fromisoformat(os.environ["SINCE"])
          STATE, MARKOV = "state.json", "markov_transitions.json"

          EXACT = {"macro_bias_confirmed", "macro_bias_stale", "mil_understanding", "markov_last_state"}
          PREFIX = ("macro_leg_", "macro_swing_", "macro_candidate_leg_", "campaign_",
                    "leg15_", "prior_macro_leg_", "prior_continuation_leg_")
          NEVER = {"campaign_status", "campaign_status_reason", "campaign_quarantined_since"}

          def is_key(k):
              return k not in NEVER and (k in EXACT or k.startswith(PREFIX))

          def git(*a):
              r = subprocess.run(["git"] + list(a), capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit("git " + " ".join(a) + " failed: " + r.stderr.strip())
              return r.stdout

          def commits():
              rows = []
              for line in git("log", "--format=%H|%cI", "-n", "600", "--", STATE).splitlines():
                  sha, when = line.split("|", 1)
                  rows.append((sha, datetime.fromisoformat(when)))
              return rows

          def status(st):
              if st.get("campaign_quarantined_since"):
                  return "CONTAMINATED"
              d = st.get("campaign_direction")
              try:
                  o = float(st.get("campaign_origin")); e = float(st.get("campaign_current_extreme"))
              except (TypeError, ValueError):
                  return "UNRESOLVED"
              if d not in ("BULLISH", "BEARISH"):
                  return "UNRESOLVED"
              if ((o - e) if d == "BEARISH" else (e - o)) <= 0:
                  return "UNRESOLVED"
              held = st.get("macro_bias_confirmed")
              if held in ("BULLISH", "BEARISH") and held != d:
                  return "UNRESOLVED"
              return "STALE" if st.get("macro_bias_stale") else "VALID"

          def summ(st):
              return "bias={}{} campaign={} {}->{} status={} mil={}".format(
                  st.get("macro_bias_confirmed"), "(stale)" if st.get("macro_bias_stale") else "",
                  st.get("campaign_direction"), st.get("campaign_origin"),
                  st.get("campaign_current_extreme"), status(st),
                  (st.get("mil_understanding") or {}).get("thesis_status"))

          def write(path, text):
              with open(path + ".tmp", "w", encoding="utf-8") as f:
                  f.write(text)
              os.replace(path + ".tmp", path)

          if MODE == "list":
              print("state.json snapshots nearest the cutoff " + SINCE.isoformat() + " (newest first)\n")
              rows = commits()
              before = sorted([r for r in rows if r[1] < SINCE], key=lambda r: r[1], reverse=True)[:30]
              after = sorted([r for r in rows if r[1] >= SINCE], key=lambda r: r[1])[:6]
              for tag, group in (("after ", list(reversed(after))), ("BEFORE", before)):
                  for sha, when in group:
                      try:
                          s = summ(json.loads(git("show", sha + ":" + STATE)))
                      except Exception as ex:
                          s = "(unreadable: " + str(ex) + ")"
                      print("{} {} {}  {}".format(tag, sha[:10], when.isoformat(), s))
              print("\nPick the LAST 'BEFORE' snapshot whose status is VALID/STALE with the bearish run you trust.")
              sys.exit(0)

          cur = json.load(open(STATE, encoding="utf-8"))

          if MODE == "mark_only":
              print("current: " + summ(cur))
              cur["campaign_quarantined_since"] = SINCE.isoformat()
              write(STATE, json.dumps(cur, indent=2))
              print("MARKED contaminated since " + SINCE.isoformat())
              sys.exit(0)

          if not SHA:
              sys.exit("sha is required for dry_run / apply")
          full = git("rev-parse", SHA).strip()
          when = dict(commits()).get(full)
          if when is None:
              sys.exit("that commit did not touch state.json")
          if not when < SINCE:
              sys.exit("REFUSED: commit is not before the cutoff (" + when.isoformat() + ")")
          old = json.loads(git("show", full + ":" + STATE))
          if status(old) not in ("VALID", "STALE"):
              sys.exit("REFUSED: campaign in that commit is " + status(old) + " - not trustworthy")

          replaced = {k: cur.get(k) for k in set(cur) | set(old) if is_key(k) and cur.get(k) != old.get(k)}
          new = {k: v for k, v in cur.items() if not (is_key(k) and k not in old)}
          for k, v in old.items():
              if is_key(k):
                  new[k] = v
          new.pop("campaign_quarantined_since", None)

          print("restoring from {} ({})".format(full[:10], when.isoformat()))
          print("  BEFORE (current):  " + summ(cur))
          print("  AFTER  (restored): " + summ(new))
          print("  keys changed: {} (cursors and all other keys untouched)".format(len(replaced)))
          if MODE != "apply":
              print("\nDRY RUN - nothing written. Run again with mode=apply.")
              sys.exit(0)

          stamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          os.makedirs("quarantine", exist_ok=True)
          write("quarantine/state_contaminated_" + stamp + ".json", json.dumps({"replaced_values": replaced}, indent=2, default=str))
          markov_note = "not present in that commit - left unchanged"
          if os.path.exists(MARKOV):
              write("quarantine/markov_transitions_contaminated_" + stamp + ".json", open(MARKOV, encoding="utf-8").read())
          r = subprocess.run(["git", "show", full + ":" + MARKOV], capture_output=True, text=True)
          if r.returncode == 0:
              write(MARKOV, r.stdout)
              markov_note = "restored from " + full[:10]
          write(STATE, json.dumps(new, indent=2, default=str))
          with open("quarantine_log.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps({
                  "logged_at": datetime.now(timezone.utc).isoformat(), "action": "restore",
                  "quarantine_start": SINCE.isoformat(),
                  "reason": "stale-bias promotion flipped BEARISH->BULLISH without defeating the campaign",
                  "restored_from_commit": full, "restored_commit_time": when.isoformat(),
                  "keys_replaced": sorted(replaced), "markov": markov_note,
                  "campaign_before": {k: cur.get(k) for k in ("campaign_direction", "campaign_origin", "campaign_current_extreme")},
                  "campaign_after": {k: new.get(k) for k in ("campaign_direction", "campaign_origin", "campaign_current_extreme")},
              }, default=str) + "\n")
          print("\nAPPLIED. markov: " + markov_note)
          PY

      - name: Run recovery
        env:
          MODE: ${{ github.event.inputs.mode }}
          SHA: ${{ github.event.inputs.sha }}
          SINCE: ${{ github.event.inputs.since }}
        run: python3 /tmp/recover.py

      - name: Commit and push (apply / mark_only only)
        if: ${{ github.event.inputs.mode == 'apply' || github.event.inputs.mode == 'mark_only' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in state.json markov_transitions.json quarantine_log.jsonl; do
            [ -f "$f" ] && git add -f "$f"
          done
          [ -d quarantine ] && git add -f quarantine
          git diff --cached --quiet || git commit -m "chore: quarantine + restore direction state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then break; fi
            git fetch origin main
            git rebase origin/main
          done
