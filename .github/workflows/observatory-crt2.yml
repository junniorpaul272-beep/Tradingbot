name: Observatory — CRT follow-up, CRT-2 (manual, read-only)

# MANUAL ONLY. CRT follow-up (CRT-2), run after wave4. Tests WHICH PART of the CRT construction carries the Wave 4 result:
# any sweep (A1), reclaim vs acceptance (B1), revisit of the sweep extreme (D1), retest entry (C1), plus exploratory context
# (volatility, sweep size, C1 range, trend). Combinations are not run.
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot.
# The holdout (everything from 2026-06-18 UTC onward) stays SEALED: this workflow cannot open it.
# Results appear on the run's Summary page and as a downloadable artifact.
on:
  workflow_dispatch:

concurrency:
  group: observatory-crt2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crt2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/wave4.py observatory/crt2.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          # crt2 needs the v2.1 wave4.py (defines `locate`). The old v1 file does not. Fail early with a clear message.
          grep -q "^def locate" observatory/wave4.py || { echo "::error::observatory/wave4.py is the OLD version (no locate). Replace it with the v2.1 wave4.py."; exit 1; }
          echo "All required files present."

      - name: Self-test (hand-built retest paths, lookahead, random-walk null)
        run: python -m observatory.crt2 --selftest

      - name: Run Wave 4
        run: |
          mkdir -p observatory_run
          python -m observatory.crt2 --raw-dir observatory_data/raw --out observatory_run > observatory_run/console.txt
          cat observatory_run/crt2_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-crt2-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
