name: Observatory — Study C, Fibonacci zones and pullback depth (manual, read-only)

# MANUAL ONLY. Study C tests the "golden zone" claim and re-runs Study B at higher power:
#   C.1  pullback of 38.2-61.8% of an impulse, then an exit (plain / strong bar / displacement): does price reach a new high before the impulse start? (family 1)
#   C.2  Study B on 15m swings, all events, day-clustered errors: break of a swing high and pullback depth below it (family 2)
#   C.3  is the golden zone better than equally wide NON-Fibonacci zones? (family 3, EXPLORATORY)
# Everything is measured against a placebo with the same barrier geometry, weekday, hour and recent move. Pivots are causal (known 45 min later).
# The pre-declared reading is printed at the top of the report.
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot. Needs studya.py and studyb.py (shared code).
# The holdout (everything from 2026-06-18 UTC onward) stays SEALED: this workflow cannot open it.
# The readiness step counts holdout EVENTS only (structure, no outcome) and computes power from DEVELOPMENT estimates.
on:
  workflow_dispatch:

concurrency:
  group: observatory-studyc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  studyc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/studya.py observatory/studyb.py observatory/studyc.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required files present."

      - name: Self-test (hand-built state machine, no lookahead, mirror, clustered statistics, random-walk and GARCH nulls, planted effect)
        run: python -m observatory.studyc --selftest

      - name: Structure counts (events per gate; no outcome is computed)
        run: |
          mkdir -p observatory_run
          python -m observatory.studyc --raw-dir observatory_data/raw --counts | tee observatory_run/studyc_counts.json

      - name: Run Study C
        run: |
          python -m observatory.studyc --raw-dir observatory_data/raw --out observatory_run > observatory_run/console.txt
          cat observatory_run/studyc_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Holdout readiness (counts events only; outcomes stay sealed)
        run: |
          python -m observatory.studyc --raw-dir observatory_data/raw --readiness | tee observatory_run/studyc_readiness.json
          { echo; echo '## Holdout readiness (event counts and power only, no holdout outcome read)'; echo '```'; cat observatory_run/studyc_readiness.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-studyc-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
