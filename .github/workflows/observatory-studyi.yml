name: Observatory — Study I stage 1, counts-only gate (manual, read-only)

# MANUAL ONLY. Study I (daily-candle range interaction, from a trading video's five scenarios): STAGE 1 is COUNTS ONLY. It builds the daily sessions (New York 17:00 primary, UTC sensitivity,
# New York 05:00 shifted-day control), classifies each against the previous valid session into eight exclusive cells, and counts: cell sizes, exclusions with reasons, recent/older blocks,
# prior-signal context, overshoot / close-location / range-width geometry, overlap between conventions, placebo-candidate supply with and without a volatility-state match, and the detectable
# effect that follows from the counts. THERE IS NO OUTCOME CODE: no barrier, no return, no estimate, no p-value. The pre-registration is frozen after these counts are reviewed.
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot. Needs studya.py ... studyi.py and standards.py (shared code).
# The holdout (everything from 2026-06-18 UTC onward) stays SEALED: sessions and windows are built from development data only.
on:
  workflow_dispatch:

concurrency:
  group: observatory-studyi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  studyi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/studya.py observatory/studyb.py observatory/studyc.py observatory/studyd.py observatory/studye.py observatory/studyf.py observatory/studyg.py observatory/studyh.py observatory/standards.py observatory/studyi.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required files present."

      - name: Self-test (session labelling incl. Sunday-open and daylight saving, eight-cell classification, mirror symmetry, past-only, window reasons, session validity, volatility state, placebo counts)
        run: python -m observatory.studyi --selftest

      - name: Run the counts-only gate
        run: |
          mkdir -p observatory_run
          python -m observatory.studyi --counts --raw-dir observatory_data/raw --out observatory_run --boundary 2024-10-03 > observatory_run/console.txt
          cat observatory_run/studyi_counts.md >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-studyi-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
