name: Observatory — Study E, price progress, path cost and time (manual, read-only)

# MANUAL ONLY. Study E asks whether the PATH price took (efficiency, retracement given back, time since the last extreme, pace) adds information about what happens next,
# beyond progress, volatility and the clock. Hourly observations, 4h lookback, 6h horizon, out-of-sample (8 time folds, 24h purge), 2-day-block clustered, one-sided.
#   E.1 direction (continuation vs reversal)   E.2 expansion (size of the move)   [family 1];  each feature alone x both outcomes [family 2, secondary]
# Also reported: stall-tercile outcome table, sensitivity at 1h / 12h lookbacks, coefficients, and a power simulation (synthetic data) with the real sampling structure.
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot. Needs studya.py, studyb.py and studyc.py (shared code).
# The holdout (everything from 2026-06-18 UTC onward) stays SEALED: this workflow cannot open it.
# The readiness step counts holdout OBSERVATIONS only (structure, no outcome) and computes power from DEVELOPMENT estimates.
on:
  workflow_dispatch:

concurrency:
  group: observatory-studye
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  studye:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/studya.py observatory/studyb.py observatory/studyc.py observatory/studye.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required files present."

      - name: Self-test (hand-built features, no lookahead, mirror, holdout sealing, null calibration, planted effects)
        run: python -m observatory.studye --selftest

      - name: Structure counts (observations; no outcome is computed)
        run: |
          mkdir -p observatory_run
          python -m observatory.studye --raw-dir observatory_data/raw --counts | tee observatory_run/studye_counts.json

      - name: Run Study E
        run: |
          python -m observatory.studye --raw-dir observatory_data/raw --out observatory_run > observatory_run/console.txt
          cat observatory_run/studye_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Holdout readiness (counts events only; outcomes stay sealed)
        run: |
          python -m observatory.studye --raw-dir observatory_data/raw --readiness | tee observatory_run/studye_readiness.json
          { echo; echo '## Holdout readiness (observation counts and power only, no holdout outcome read)'; echo '```'; cat observatory_run/studye_readiness.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Power simulation (synthetic data only; what size of effect is detectable with this sampling structure)
        run: |
          python -m observatory.studye --power --power-reps 12 --out observatory_run | tee observatory_run/studye_power_console.txt
          { echo; echo '## Power simulation (synthetic)'; echo '```'; cat observatory_run/studye_power_console.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-studye-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
