name: Flush EXP3 (manual, one-off)

# Per chat, 2026-08-15: flush_exp3.py is a one-time maintenance script,
# not a scheduled job — this workflow exists purely to let it be run
# from the GitHub Actions tab (workflow_dispatch) instead of requiring a
# local Python environment, since the mobile/Telegram workflow this repo
# is otherwise built around doesn't give an easy way to run a script by
# hand. Safe to leave in the repo permanently — it does nothing unless
# manually triggered, and flush_exp3.py itself is idempotent (a second
# run with nothing left tagged EXP3_POI just reports "nothing to flush"
# and changes nothing).
#
# Two-step by design: first run with the default (dry run) to see the
# report BEFORE anything is sent or changed; only re-run with "commit"
# set to true once you've checked the preview in the job log.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Actually send the report + archive + reset (unchecked = dry run, report preview only, nothing sent or changed)'
        type: boolean
        default: false

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flush_exp3.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: |
          if [ "${{ inputs.commit }}" = "true" ]; then
            python flush_exp3.py --commit
          else
            python flush_exp3.py
          fi

      - name: Save archived/reset files back to repo
        if: ${{ inputs.commit == true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in shadow_state.json shadow_stats.json shadow_trade_log.jsonl \
                   exp3_poi_pre_sr_archive.jsonl; do
            [ -f "$f" ] && git add -f "$f"
          done
          git diff --cached --quiet || git commit -m "chore: flush EXP3_POI, archive + reset [skip ci]"
          git push
