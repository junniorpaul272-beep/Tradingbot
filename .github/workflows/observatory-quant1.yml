name: Observatory — Quantitative programme Phases 1-2, Bachelier and the GBPUSD reality check (manual, read-only)

# MANUAL ONLY. Phase 1: proves the Bachelier simulator reproduces the mathematics (14 exact checks, a hard gate).
# Phase 2: compares GBPUSD with the model on development data: price-change distributions at 8 horizons, the
# square-root-of-time rule, variance ratios, independence of increments, tails.
# Descriptive. No direction is predicted and no trade is simulated.
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot.
# The holdout (everything from 2026-06-18 UTC onward) stays SEALED: only windows that end before it are used.
on:
  workflow_dispatch:

concurrency:
  group: observatory-quant1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quant1:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/quant1.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required files present."

      - name: Self-test (Bachelier gate + statistics against known synthetic processes)
        run: python -m observatory.quant1 --selftest

      - name: Run Phases 1-2
        run: |
          mkdir -p observatory_run
          python -m observatory.quant1 --raw-dir observatory_data/raw --out observatory_run > observatory_run/console.txt
          cat observatory_run/quant1_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-quant1-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
