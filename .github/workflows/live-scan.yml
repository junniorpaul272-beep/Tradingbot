name: GBPUSD SMC Scanner — Live

# TRIGGER: this workflow is invoked by cron-job.org hitting the
# workflow_dispatch REST endpoint every 5 minutes (GitHub's native
# `schedule:` trigger is not used — confirmed unreliable/doesn't fire
# on this account). See "cron-job.org setup" in SPLIT_STATUS.md for the
# exact API endpoint/PAT/payload this job expects.
on:
  workflow_dispatch:

# Same reasoning as the original single-file workflow: without this, an
# overlapping trigger starts a second job in parallel and both try to push
# their own state.json/stats.json update back to main.
concurrency:
  group: gbpusd-scanner-live
  cancel-in-progress: false

jobs:
  # FAST GATE (2026-10-19): cron-job.org can trigger this workflow every minute. This tiny job decides, in seconds, whether the
  # real scan job below should run: only when a Telegram message is waiting or the last scan is 5+ minutes old. It only PEEKS
  # at Telegram (never consumes an update), never writes anything, and fails OPEN (any doubt = run the scan). Public repo:
  # standard runner minutes are free. See comms/fast_gate.py.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout only what the gate needs
        uses: actions/checkout@v4
        with:
          # ref: main = the NEWEST main at the moment this job starts. Without it GitHub checks out the main that existed when the
          # run was CREATED; a run that waited behind another one then read an out-of-date stats.json and wrongly decided a scan was due.
          ref: main
          sparse-checkout: |
            stats.json
            comms/fast_gate.py
          sparse-checkout-cone-mode: false
      - name: Decide whether to scan
        id: gate
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python comms/fast_gate.py .

  scan:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}   # a failed gate leaves the output empty, so the scan still runs
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # ref: main (2026-10-20): the NEWEST main when this job starts, not the main from when the run was created. With a trigger every
          # minute a run can wait behind another one; checking out the old main made its commit collide with the other run's push
          # ("rebase conflict could not be auto-resolved").
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Enforce module layer boundaries
        # Standalone, zero-dependency (stdlib only: ast/sys/pathlib) —
        # runs before "Install dependencies" on purpose, so a layer
        # violation fails the job before spending time on pip install or
        # touching Twelve Data/Telegram at all. See check_layer_imports.py's
        # own docstring for the rule being enforced.
        run: python check_layer_imports.py .

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live scanner
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROUP_CHAT_ID:    ${{ secrets.GROUP_CHAT_ID }}
          TWELVE_DATA_KEY:  ${{ secrets.TWELVE_DATA_KEY }}
        run: python scanner_live.py

      # BUS (2026-10-01): runs AFTER the scan so state.json is fresh, and BEFORE the commit so
      # inbox.jsonl / user_ledger.jsonl are saved. continue-on-error: a Telegram outage or a BUS
      # bug must never fail the scan job; replies are written to the ledger BEFORE sending and are
      # retried from the stored text next run (bus_runner.py).
      # State history (2026-10-14): one compact record per SUCCESSFUL scan -> state_history_log.jsonl. Steps after
      # a failed scan step are skipped by default, so a failed scan appends nothing. state_history.py is the only
      # writer of that file and skips a scan it has already recorded.
      - name: Record state history
        continue-on-error: true
        run: python comms/state_history.py .

      - name: Inspect integrity (independent observer)
        continue-on-error: true
        run: python comms/inspector.py .

      - name: BUS - answer queued messages and announce findings
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Fired-signal reporting through BUS: OFF unless the repository VARIABLE BUS_SIGNALS is set to 1
          # (Settings -> Secrets and variables -> Actions -> Variables). Report-only: it reads
          # signal_event_log.jsonl and never touches the engine, the legacy alert path or any trade decision.
          BUS_SIGNALS: ${{ vars.BUS_SIGNALS }}
        run: python comms/bus_runner.py .

      - name: Validate JSON integrity before commit
        # Guards against cache poisoning: if scanner_live.py crashed
        # mid-write and left a truncated/corrupt JSON file, we must NOT
        # commit it — MIN reads candle_cache.json off disk with no
        # independent source of truth to catch a corrupt-but-parseable-
        # looking file. jsonl files are validated line-by-line since each
        # line is an independent record; one bad trailing line shouldn't
        # block the whole file.
        run: |
          set -e
          fail=0
          for f in stats.json state.json inspector_state.json bias_ab_log.json markov_transitions.json candle_cache.json \
                   account_profiles.json integrity_baseline.json; do
            if [ -f "$f" ]; then
              jq empty "$f" >/dev/null 2>&1 || { echo "::error::$f failed JSON validation — NOT committing"; fail=1; }
            fi
          done
          for f in rejected_live_queue.jsonl live_trade_log.jsonl scan_log.jsonl brain_log.jsonl briefing_log.jsonl \
                   market_event_pending.jsonl ohlc_5m_log.jsonl ohlc_15m_log.jsonl ohlc_1h_log.jsonl \
                   scan_index_log.jsonl structure_digest_log.jsonl zone_log.jsonl thesis_context_log.jsonl \
                   signal_event_log.jsonl market_event_log.jsonl inbox.jsonl user_ledger.jsonl integrity_ledger.jsonl state_history_log.jsonl; do
            if [ -f "$f" ]; then
              # One jq pass per file (was one jq process per LINE, ~1 minute per scan as the logs grew). Same rule: every non-blank line must be valid JSON.
              bad=$(jq -Rr 'select(test("\\S")) | try (fromjson | empty) catch "line \(input_line_number)"' "$f" 2>&1 | head -5 | tr '\n' ' ')
              if [ -n "$bad" ]; then echo "::error::$f failed JSON validation at: $bad"; fail=1; fi
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "::error::One or more owned files failed integrity validation — aborting before commit to avoid poisoning main."
            exit 1
          fi

      - name: Save live-owned files back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # scanner_live.py is the sole writer of every file in this list.
          # candle_cache.json and rejected_live_queue.jsonl are NEW — MIN's
          # entire cache-based handoff depends on these actually landing on
          # main. markov_transitions.json was missing from the original
          # single-file workflow's list too (pre-existing, not introduced
          # by the split) — added here since scanner_live.py is its owner.
          # market_intent_*: FOUND MISSING, 2026-08-15 — Market Intent
          # (built earlier the same day) had been running with its state
          # silently discarded every single run since it shipped: nothing
          # in this list means nothing survives past one ephemeral runner,
          # so "currently open" always loaded empty and no tracked
          # instance could ever reach a resolution across scans.
          # account_profiles.json: added proactively, 2026-08-16, same
          # build turn it was introduced — Account Profiles genuinely
          # needs to persist (a balance the user sets has to survive),
          # unlike Bank's own simulation which is deliberately stateless.
          # Checked this file directly rather than trusting a code
          # comment to remember it, per the market_intent_* lesson above.
          # scan_log.jsonl: added 2026-08-23, same build turn it was
          # introduced — one line per _scan_once() invocation, written
          # unconditionally before any early return, specifically so the
          # System Overview Ledger's per-day coverage field can answer
          # "did the bot observe nothing, or did it not observe" rather
          # than inferring scan activity from side effects that only
          # fire on some exit paths. Checked directly here rather than
          # trusting a code comment to remember it, same lesson as
          # market_intent_* above.
          # brain_log.jsonl: added 2026-08-25, same build turn it was
          # introduced — _append_brain_log() is scanner_live.py's only
          # writer of this file (brain.py itself stays fully ephemeral,
          # per its own module docstring). Added to this list in the
          # SAME turn the write path shipped, specifically to avoid
          # repeating the market_intent_*/scan_log.jsonl lesson above —
          # checked directly here, not assumed from a code comment.
          # integrity_baseline.json: added 2026-08-26, same build turn
          # /integrity shipped — scanner_integrity.py's
          # structural_signature_check() writes this whenever /integrity
          # runs (learned schema baseline for structure_digest/
          # live_tier_digest). Same lesson as market_intent_* above,
          # applied proactively instead of waiting to rediscover it:
          # without this, the baseline never survives an ephemeral
          # runner, so schema evolution is never actually learned and
          # every legitimately-added field looks like a violation
          # forever. NOTE: pipeline_checkpoints.jsonl (Layer 3 —
          # continuity) is NOT added here because nothing writes it yet
          # — scanner_live.py isn't instrumented with PipelineCheckpoint
          # calls yet (see integration_notes.md). Add it here in the
          # SAME turn that instrumentation actually ships, not after.
          # briefing_log.jsonl: added 2026-08-26, same build turn /briefing
          # shipped — _append_briefing_log() is scanner_live.py's only
          # writer of this file (brain.py itself stays fully ephemeral,
          # per its own module docstring, same as brain_log.jsonl above).
          # Added in the SAME turn the write path shipped, same lesson as
          # market_intent_* above — checked directly here, not assumed.
          # market_event_pending.jsonl: ADDED 2026-08-27, per audit — this
          # is the LIVE side of the same shared-write pattern rejected_
          # live_queue.jsonl already uses above (LIVE appends new tagged
          # Market Events here, MIN drains resolved ones in _close_leg_
          # obs()). Needs the same merge=union .gitattributes treatment
          # as rejected_live_queue.jsonl — added to BOTH workflows'
          # validate/commit lists, mirror that file's entry there too.
          # See MARKET_EVENT_PENDING_FILE's docstring in scanner_common.py
          # for the full story: this used to be a state.json key, and
          # every write min_scanner.py made to it was silently discarded
          # because min-scan.yml never committed state.json — checked
          # directly by reading both workflow files rather than assumed,
          # same lesson as every entry above it in this list.
          # ohlc_5m_log.jsonl / ohlc_15m_log.jsonl / ohlc_1h_log.jsonl:
          # ADDED 2026-09-02, per chat — candle_cache.json above is a
          # rolling ~200-bar snapshot, fully overwritten every scan; it
          # was never a permanent OHLC archive despite being committed
          # every 5 minutes. append_ohlc_history() in scanner_live.py is
          # the sole writer (dedup via a cursor in state.json — see its
          # own docstring). Added in the SAME turn the write path
          # shipped, same lesson as every entry above it in this list —
          # checked directly, not assumed.
          # scan_index_log.jsonl / structure_digest_log.jsonl / zone_log.jsonl:
          # ADDED 2026-09-18, per chat — Research Lab groundwork. All three
          # are single-writer, LIVE-owned (next_scan_id()/append_permanent_
          # jsonl() calls inside _scan_once(), scanner_common.py), same
          # ownership shape as ohlc_*_log.jsonl above — no merge=union
          # needed (that's only for files BOTH workflows write, like
          # rejected_live_queue.jsonl / market_event_pending.jsonl). Added
          # to this list in the SAME turn the write paths shipped, per the
          # standing lesson every entry above already documents: nothing
          # in this list means nothing survives past one ephemeral runner.
          # thesis_context_log.jsonl: ADDED 2026-09-20, per chat (friend's
          # "storing context" proposal) — companion to structure_digest_
          # log.jsonl, same scan_id join key, same single-writer LIVE-owned
          # shape, no merge=union needed. Carries the Market Thesis
          # Engine's per-scan break_count/transition_cause/trend_health/
          # failure_risk/mtf_15m/mtf_5m/campaign fields — these were
          # already being computed every scan but only ever written to
          # state["market_thesis_*"], a same-key field the next scan
          # overwrites; same "thrown away every scan" bug structure_
          # digest_log.jsonl itself was built to fix on 2026-09-18, found
          # again in a second place. Added in the SAME turn the write path
          # shipped.
          # signal_event_log.jsonl: ADDED 2026-09-30, per chat (communication
          # rebuild, engine-only mode) — scanner_live.py's
          # _record_undelivered_signal() is the sole writer: one permanent
          # FIRED_RISK_GATE_PASSED_UNDELIVERED record per signal that fired
          # and passed the risk gate while Telegram delivery is suppressed.
          # Single-writer LIVE-owned, no merge=union needed. Added in the
          # SAME turn the write path shipped, per the standing lesson above:
          # nothing in this list means nothing survives the ephemeral runner.
          # inbox.jsonl (scanner_live, transport), user_ledger.jsonl (bus_runner, single writer) and
          # integrity_ledger.jsonl (inspector, single writer) added 2026-10-01 with the code that writes them.
          for f in stats.json state.json inspector_state.json bias_ab_log.json markov_transitions.json \
                   candle_cache.json rejected_live_queue.jsonl live_trade_log.jsonl \
                   market_intent_state.json market_intent_log.jsonl market_intent_case_log.jsonl \
                   account_profiles.json scan_log.jsonl brain_log.jsonl briefing_log.jsonl \
                   integrity_baseline.json market_event_pending.jsonl \
                   ohlc_5m_log.jsonl ohlc_15m_log.jsonl ohlc_1h_log.jsonl \
                   scan_index_log.jsonl structure_digest_log.jsonl zone_log.jsonl thesis_context_log.jsonl \
                   signal_event_log.jsonl market_event_log.jsonl inbox.jsonl user_ledger.jsonl integrity_ledger.jsonl state_history_log.jsonl; do
            [ -f "$f" ] && git add -f "$f"
          done
          git diff --cached --quiet || git commit -m "chore: live scan update [skip ci]"

          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt) — fetching and rebasing before retry..."
            git fetch origin main
            # NOTE: -X ours removed. It silently discarded the OTHER
            # workflow's concurrent changes to shared files on conflict
            # (confirmed: rejected_live_queue.jsonl is written by both
            # live and MIN). Plain rebase now defers to the merge=union
            # driver configured above for files marked as such in
            # .gitattributes, and fails loudly (not silently) on any
            # conflict it can't resolve, which is the correct behavior
            # for files with no union driver.
            git rebase origin/main || {
              echo "::error::Rebase conflict could not be auto-resolved — aborting rather than risk silent data loss."
              git rebase --abort
              exit 1
            }
          done

      - name: Alert on job failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ GBPUSD Live scan FAILED — run #${{ github.run_number }}. Check Actions tab." \
            > /dev/null

      # Runs after the git push on purpose — same reasoning as the original:
      # the scanner's own continuity matters more than the dashboard being
      # up to date this exact minute.
      - name: Ingest to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest.py --data-dir .
