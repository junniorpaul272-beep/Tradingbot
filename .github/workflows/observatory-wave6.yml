name: Observatory — Wave 6 experiments, volatility persistence and market state (manual, read-only)

# MANUAL ONLY. No direction is tested. Question: after a displacement, are the next bars unusually large compared
# with equally active ordinary moments (matched on session, long-run activity and the heat of the 6 bars before)?
# 5m, 15m, 1h; 3 primary tests. Also prints the decay curve, the split by pre-event state, the session profile and
# the volatility-state transition matrix (all descriptive).
# READ-ONLY: no commits, no API calls, no secrets, never touches the live bot.
# The holdout (everything from 2026-06-18 UTC onward) stays SEALED: this workflow cannot open it.
on:
  workflow_dispatch:

concurrency:
  group: observatory-wave6
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wave6:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          missing=0
          for f in observatory/__init__.py observatory/clean.py observatory/measure.py observatory/gates.py \
                   observatory/wave1.py observatory/wave6.py \
                   observatory_data/raw/GBPUSD_5m.jsonl observatory_data/raw/GBPUSD_15m.jsonl observatory_data/raw/GBPUSD_1h.jsonl; do
            if [ ! -f "$f" ]; then echo "::error::MISSING: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          grep -q "def cluster_slope_test" observatory/wave1.py || { echo "::error::observatory/wave1.py is the OLD version. Replace it with the latest wave1.py."; exit 1; }
          echo "All required files present."

      - name: Self-test (past-only features, planted-effect recovery, constant-volatility null, clustered-volatility positive control)
        run: python -m observatory.wave6 --selftest

      - name: Run Wave 6
        run: |
          mkdir -p observatory_run
          python -m observatory.wave6 --raw-dir observatory_data/raw --out observatory_run > observatory_run/console.txt
          cat observatory_run/wave6_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm raw data unchanged
        run: |
          git diff --quiet -- observatory_data/raw || { echo "::error::raw data changed during the run"; exit 1; }
          echo "Raw data unchanged."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-wave6-${{ github.run_number }}
          path: observatory_run/
          if-no-files-found: ignore
          retention-days: 90
