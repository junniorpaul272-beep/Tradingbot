# ONE-OFF — workflow_dispatch only, deliberately NOT on a schedule.
# Run this manually, once, from the Actions tab after backfill_system_
# ledger.py is committed. It should not exist as a recurring workflow —
# delete this file (or leave it, since workflow_dispatch never fires on
# its own) once the backfill has actually been run successfully.
#
# NOTE: I don't have your actual min-scan.yml/live-scan.yml on hand to
# copy its exact checkout/commit-back steps, secrets names, or Python
# version — this follows the general shape scanner_live.py's own module
# docstring describes (cron-job.org triggers a GitHub Actions workflow
# that runs a script, commits state back to the repo). Check this
# against your real workflow files before running — the checkout/commit
# steps below are a reasonable default, not a confirmed match to your repo.

name: One-off — Backfill System Ledger

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # match whatever scanner_live.py already runs on

      - name: Install dependencies
        run: pip install pandas requests  # match requirements.txt if one exists

      - name: Run backfill (read-only against source logs, writes ONLY
              daily_ledger.jsonl — never touches shadow_trade_log.jsonl,
              bank_transactions.jsonl, leg_obs_log.jsonl, or
              failure_case_log.jsonl)
        run: python backfill_system_ledger.py

      - name: Commit new ledger file back to repo
        run: |
          git config user.name "ledger-backfill-bot"
          git config user.email "actions@github.com"
          git add daily_ledger.jsonl
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "One-off: backfill daily_ledger.jsonl from existing history"
          git push
